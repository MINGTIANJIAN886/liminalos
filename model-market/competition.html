    const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function card(c,i){return `<article class="card"><div class="cover ${c.theme}"><span class="cover-code">LMC-${String(i+1).padStart(2,'0')} / 2026</span><div class="cover-icon">${escapeHTML(c.icon)}</div><span class="status ${c.status==='即将开始'?'soon':''}">${c.status==='进行中'?'● ':''}${escapeHTML(c.status)}</span></div><div class="card-body"><span class="kind">${escapeHTML(c.kind)}</span><h3>${escapeHTML(c.title)}</h3><p class="en">${escapeHTML(c.en)}</p><p class="desc">${escapeHTML(c.desc)}</p><div class="tags">${c.tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}</div><div class="meta"><span>参赛规模<b>${c.teams} 支队伍 · ${c.models} 个模型</b></span><span class="deadline">报名截止<b>${escapeHTML(c.deadline)}</b></span></div></div></article>`}
    function render(){document.querySelector('#filters').innerHTML=categories.map(c=>`<button class="filter ${active===c?'active':''}" type="button" data-category="${c}" aria-pressed="${active===c}">${c}</button>`).join('');const rows=competitions.filter(c=>(active==='全部比赛'||c.category===active)&&(!query||[c.title,c.en,c.category,c.desc,...c.tags].join(' ').toLowerCase().includes(query)));document.querySelector('#count').textContent=rows.length;const groups=[['进行中','ongoing'],['即将开始','upcoming']];document.querySelector('#sections').innerHTML=groups.map(([status,id])=>{const list=rows.filter(c=>c.status===status);return list.length?`<section class="section-block" id="${id}"><div class="section-title"><h2><span></span>${status}</h2></div><div class="cards">${list.map(c=>card(c,competitions.indexOf(c))).join('')}</div></section>`:''}).join('')||'<div class="empty">没有找到符合当前条件的比赛，请尝试其他关键词或分类。</div>'}
    document.addEventListener('click',e=>{const f=e.target.closest('[data-category]');if(f){active=f.dataset.category;render()}});document.querySelector('#searchForm').addEventListener('submit',e=>{e.preventDefault();query=document.querySelector('#search').value.trim().toLowerCase();render();document.querySelector('#competitions').scrollIntoView({behavior:'smooth'})});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});const menu=document.querySelector('#mobileMenu');menu.addEventListener('click',()=>{const open=document.querySelector('#topnav').classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});document.querySelectorAll('#topnav a').forEach(a=>a.addEventListener('click',()=>{document.querySelector('#topnav').classList.remove('open');menu.setAttribute('aria-expanded','false')}));render();
  </script>
  <script src="../account-store.js"></script>
  <script src="../account-nav.js"></script>
</body>
</html>
